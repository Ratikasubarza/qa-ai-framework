[pytest]
asyncio_mode = auto
addopts = --alluredir=reports/allure/results
markers =
    smoke: P0 — run before every deploy
    sanity: P1 — critical path only
    regression: P2 — full suite
    flaky: known unstable — monitor only
    api: API tests (httpx)
    web: Web Playwright tests
    android: Android Appium tests
    security: auth and access-control assertions
    negative: expected failure / rejection cases
    boundary: edge values and limits
    performance: response time assertions
    combination: combined parameter tests
