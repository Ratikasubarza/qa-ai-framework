[project]
name = "qa-ai-framework"
version = "1.0.0"
description = "AI-powered QA automation framework for Hono app"
requires-python = ">=3.11"

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I"]          # errors, warnings, pyflakes, isort
ignore = ["E501", "E402"]              # line-length handled above; module-level imports OK

[tool.ruff.lint.per-file-ignores]
"tests/*"      = ["F811"]              # pytest fixtures can shadow outer names
"conftest*.py" = ["F811", "F401"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
files = ["core", "agents", "orchestrator", "knowledge_base"]

# ── Pytest (single authoritative config — pytest.ini deleted) ────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
addopts = [
    "--alluredir=reports/allure/results",
    "--tb=short",
    "--strict-markers",
    "-v",
    "-n auto",
]
testpaths = ["tests", "features"]
log_cli = true
log_cli_level = "INFO"
markers = [
    "smoke:       happy-path end-to-end — run first",
    "regression:  full regression suite — merge gate / nightly",
    "security:    auth, RBAC, and access-control assertions",
    "negative:    expected rejection and error cases",
    "boundary:    edge values, limits, overflow",
    "performance: response time SLA assertions",
    "agent:       LLM agent quality gates (evals)",
    "mobile:      Appium Android — requires connected device",
    "web:         Playwright — requires browser",
    "api:         API automation tests via httpx",
    "db:          tests that write to staging DB — run serially",
    "flaky:       known intermittent test — quarantine candidate",
    "combination: combined parameter / pairwise tests",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["agents", "core", "skills", "platforms", "integrations"]
omit   = ["*/test*", "*/venv/*", "*/conftest*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
