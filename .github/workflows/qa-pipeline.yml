name: QA AI Framework — Automated Test Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run every day at 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - api
          - self-healing
          - debug-agent

env:
  PYTHON_VERSION: '3.11'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
  HONO_API_URL: ${{ secrets.HONO_API_URL }}
  HONO_API_KEY: ${{ secrets.HONO_API_KEY }}
  STAGING_EMAIL: ${{ secrets.STAGING_EMAIL }}
  STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
  JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
  JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_QA_LEADS_CHAT_ID: ${{ secrets.TELEGRAM_QA_LEADS_CHAT_ID }}
  TELEGRAM_QA_TEAM_CHAT_ID: ${{ secrets.TELEGRAM_QA_TEAM_CHAT_ID }}
  TELEGRAM_QA_OPS_CHAT_ID: ${{ secrets.TELEGRAM_QA_OPS_CHAT_ID }}
  TELEGRAM_QA_BUGS_CHAT_ID: ${{ secrets.TELEGRAM_QA_BUGS_CHAT_ID }}
  APPROVAL_REQUIRED: 'false'
  AUTO_CREATE_BUGS: 'false'


jobs:
  # ── Job 1: Smoke Test ──────────────────────────────────────────────
  smoke:
    name: Smoke Test — LLM Connection
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test
        run: |
          ./venv/bin/python3.11 --version
          PYTHONPATH=. ./venv/bin/python3.11 -c "from config.test_config import TestConfig; print('Config OK')"
          echo "Smoke test passed"

  # ── Job 2: API Tests ───────────────────────────────────────────────
  api-tests:
    name: API Tests — api-dev.thehono.com
    runs-on: self-hosted
    needs: smoke
    if: github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'api' || github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - name: Run API tests
        run: |
          mkdir -p reports/junit
          PYTHONPATH=. ./venv/bin/python3.11 -m pytest \
            features/login/steps/api/login_api_test.py \
            features/register/steps/api/register_api_test.py \
            features/cms_login/steps/api/cms_login_api_test.py \
            features/cms_users/steps/api/cms_users_api_test.py \
            features/cms_users/steps/api/cms_approve_user_test.py \
            features/cms_users/steps/api/cms_reject_user_test.py \
            features/onboarding/steps/api/onboarding_api_test.py \
            --junit-xml=reports/junit/api-results.xml -v --tb=short

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: reports/junit/api-results.xml

  # ── Job 3: Web Tests ───────────────────────────────────────────────
  web-tests:
    name: Web Tests — app-dev.thehono.com
    runs-on: self-hosted
    needs: smoke
    if: github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'web' || github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - name: Run web tests
        run: |
          mkdir -p reports/junit
          PYTHONPATH=. ./venv/bin/python3.11 -m pytest \
            features/login/steps/web/login_web_app_test.py \
            --junit-xml=reports/junit/web-results.xml -v --tb=short

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-failure-screenshots
          path: reports/debug_logs/

      - name: Upload web test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: reports/junit/web-results.xml

  # ── Job 4: Self-Healing Tests ──────────────────────────────────────
  self-healing-tests:
    name: Self-Healing Tests
    runs-on: self-hosted
    needs: web-tests
    if: github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'self-healing' || github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - name: Run self-healing tests
        run: PYTHONPATH=. ./venv/bin/python3.11 -m pytest features/login/steps/web/login_web_app_test.py::test_TC_WEB_005_self_healing_demo -v --tb=short

      - name: Upload self-healing results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-healing-results
          path: reports/

  # ── Job 5: Debug Agent Tests ───────────────────────────────────────
  debug-agent-tests:
    name: Debug Agent Tests
    runs-on: self-hosted
    needs: smoke
    if: github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'debug-agent' || github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - name: Run debug agent tests
        run: |
          mkdir -p reports/junit
          PYTHONPATH=. ./venv/bin/python3.11 -m pytest \
            tests/test_debug_agent.py \
            --junit-xml=reports/junit/debug-results.xml -v --tb=short

      - name: Upload debug agent results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-agent-results
          path: reports/junit/debug-results.xml

  # ── Job 6: Report & Notify ─────────────────────────────────────────
  report:
    name: Generate Report & Notify
    runs-on: self-hosted
    needs: [api-tests, web-tests, debug-agent-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: reports/junit/
          merge-multiple: true

      - name: Debug downloaded artifacts
        run: |
          echo "=== Files in reports/ ==="
          find reports/ -type f 2>/dev/null || echo "reports/ empty or missing"

      - name: Send Telegram notification
        run: |
          ./venv/bin/python3.11 << 'PYEOF'
          import httpx, os, glob
          import xml.etree.ElementTree as ET

          token   = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_QA_OPS_CHAT_ID")

          def format_suite_name(filename):
              """Auto-format suite name from filename — no manual mapping needed.
              Examples:
                login_api_test.py      → Login API
                cms_approve_user_test  → CMS Approve User
                onboarding_android_test → Onboarding Android
              """
              name = filename.replace("_test", "").replace("test_", "")
              name = name.replace("_", " ").title()
              return name

          total_passed = total_failed = 0
          suite_results = []

          xml_files = (
              glob.glob("reports/junit/*.xml") +
              glob.glob("reports/junit/**/*.xml", recursive=True)
          )

          for f in sorted(xml_files):
              try:
                  tree = ET.parse(f)
                  root = tree.getroot()
                  tests   = int(root.get("tests", 0))
                  failures = int(root.get("failures", 0))
                  errors   = int(root.get("errors", 0))
                  p = tests - failures - errors
                  fa = failures + errors

                  total_passed += p
                  total_failed += fa

                  # Auto-format suite name from filename
                  fname = os.path.splitext(os.path.basename(f))[0]
                  suite = format_suite_name(fname)
                  icon = "✅" if fa == 0 else "❌"
                  suite_results.append(f"{icon} {suite}: {p}/{tests}")
              except Exception as e:
                  suite_results.append(f"⚠️ {os.path.basename(f)}: parse error")

          overall = "✅ ALL PASSED" if total_failed == 0 else f"❌ {total_failed} FAILED"
          branch  = os.getenv("GITHUB_REF_NAME", "unknown")
          run_url = f"https://github.com/{os.getenv('GITHUB_REPOSITORY')}/actions/runs/{os.getenv('GITHUB_RUN_ID')}"
          actor   = os.getenv("GITHUB_ACTOR", "unknown")

          suite_lines = "\n".join(suite_results) if suite_results else "No test results found"

          msg = (
              f"{overall} *QA Pipeline*\n\n"
              f"*Branch:* `{branch}`\n"
              f"*Triggered by:* {actor}\n\n"
              f"*Suite Results:*\n"
              f"{suite_lines}\n\n"
              f"*Total:* {total_passed} passed / {total_failed} failed\n"
              f"*Run:* [View Details]({run_url})"
          )

          if token and chat_id:
              httpx.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat_id, "text": msg, "parse_mode": "Markdown"},
              )
              print(f"✓ Telegram notified: {status}")
          PYEOF
