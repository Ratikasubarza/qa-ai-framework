# Login — Web Locators
# Source: features/login/locators/web/login_web_locators.py
# These YAML files are metadata only — the Python files remain the runtime source.
# The locator_agent and self_healer use these for healing proposals.

feature: login
platform: web
app_url: app-dev.thehono.com
last_audited: "2026-05-18"

locators:
  - name: EMAIL_FIELD
    primary: 'input[type="email"]'
    fallbacks:
      - 'input[placeholder*="email" i]'
      - '[data-testid="email-input"]'
    strategy: css
    description: "Email input field on login form"
    required: true
    confidence: 0.95
    last_verified: "2026-05-18"
    healing_history: []

  - name: PASSWORD_FIELD
    primary: 'input[type="password"]'
    fallbacks:
      - 'input[placeholder*="password" i]'
      - '[data-testid="password-input"]'
    strategy: css
    description: "Password input field on login form"
    required: true
    confidence: 0.95
    last_verified: "2026-05-18"
    healing_history: []

  - name: LOGIN_BUTTON
    primary: 'button[type="submit"]'
    fallbacks:
      - 'button:has-text("Login")'
      - 'button:has-text("Sign in")'
      - '[data-testid="login-button"]'
    strategy: css
    description: "Submit/Login button on login form"
    required: true
    confidence: 0.90
    last_verified: "2026-05-18"
    healing_history: []

  - name: ERROR_MESSAGE
    primary: 'text=Invalid'
    fallbacks:
      - '[role="alert"]'
      - '.error-message'
    strategy: text
    description: "Error message shown on invalid credentials"
    required: false
    confidence: 0.80
    last_verified: "2026-05-18"
    healing_history: []

  - name: SUCCESS_URL
    primary: "/feed"
    fallbacks: []
    strategy: url_suffix
    description: "URL suffix after successful login"
    required: true
    confidence: 0.99
    last_verified: "2026-05-18"
    healing_history: []
